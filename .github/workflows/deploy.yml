# vitrine.software: built and deployed to Cloudflare Workers on every push to main (and by hand). The demo (the
# app's web client in demo mode with its library, ~130 MB) isn't in git: it's the vitrine-demo.tar.gz of this
# repository's release tagged "demo", put at public/demo/app before the build.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/demo/app
          gh release download demo --repo "$GITHUB_REPOSITORY" --pattern vitrine-demo.tar.gz --output /tmp/demo.tar.gz
          tar -xzf /tmp/demo.tar.gz -C public/demo/app
      - run: npx astro build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
