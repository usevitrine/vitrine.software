# vitrine.software: built and deployed to Cloudflare Workers on every push to main, by hand, and when the app moves on
# (update-app.yml). The demo is built here from the app submodule (its web client in demo mode and its search engine
# as WebAssembly), so it always matches the app the site points at; only its library - public-domain art and Blender
# clips with their data, which rarely change - comes from this repository's release tagged "demo"
# (demo-library.tar.gz: the app's tools/demosnap output).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/web/package-lock.json
      - run: npm ci
      - name: The demo (from the app submodule, with its library)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/demo-library
          gh release download demo --repo "$GITHUB_REPOSITORY" --pattern demo-library.tar.gz --output /tmp/demo-library.tar.gz
          tar -xzf /tmp/demo-library.tar.gz -C /tmp/demo-library
          npm ci --prefix app/web
          npm run build:demo --prefix app/web -- /tmp/demo-library
          node scripts/demo.mjs
      - run: npx astro build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
